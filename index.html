<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Recipes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="title">RECOMMENDED<br><span class="subtitle">Recipes</span></h1>
        </header>

        <main>
            <div class="carousel-wrapper">
                
                <div class="carousel-track-container" id="track-container">
                    <div id="skeleton-container" class="recipe-track">
                    </div>

                    <div id="recipe-container" class="recipe-track hidden">
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
